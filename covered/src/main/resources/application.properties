spring.application.name=covered

# Render assigns the port it wants the container to listen on via PORT and routes
# public traffic to it. Locally that variable is unset, so fall back to 8080 -
# which is what the Vite dev proxy in vite.config.js expects.
server.port=${PORT:8080}

# --- Solver -----------------------------------------------------------------

timefold.solver.termination.unimproved-spent-limit=1s

# --- Database ---------------------------------------------------------------

spring.jpa.hibernate.ddl-auto=update

# --- Health -----------------------------------------------------------------

# Render pings a health path to decide whether a deploy succeeded and whether the
# instance is still alive. Expose only /actuator/health, nothing else.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
