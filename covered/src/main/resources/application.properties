spring.application.name=covered

# Upper bound on a solve. Infeasible problems use all of it before giving up.
timefold.solver.termination.spent-limit=5s
# Daily overtime is a soft constraint, so 0hard/0soft is no longer provably optimal and there
# is no best-score-limit to stop on -- a feasible schedule may still have overtime worth
# shaving. Stop once a second passes with no improvement instead, which keeps an easy solve
# from sitting out the full five seconds.
timefold.solver.termination.unimproved-spent-limit=1s
