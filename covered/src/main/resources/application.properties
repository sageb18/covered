spring.application.name=covered

# Upper bound on a solve. Infeasible problems use all of it before giving up.
timefold.solver.termination.spent-limit=5s
# There are no soft constraints yet, so 0hard/0soft is provably optimal -- stop there
# instead of burning the full budget. REMOVE THIS LINE if soft constraints are added,
# or the solver will stop before optimising them.
timefold.solver.termination.best-score-limit=0hard/0soft
